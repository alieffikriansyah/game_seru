<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneksi Terputus — Game Seru 🎮</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1145 0%, #0a0a14 70%);
            color: #f0f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.2);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
            display: inline-block;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.8)); }
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: #a0a0c0;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 240px;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
        }
        .btn-retry:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Koneksi Terputus!</h1>
        <p>Anda sedang berada di luar jaringan atau server game tidak dapat dijangkau. Periksa koneksi internet Anda untuk kembali bermain.</p>
        <button class="btn-retry" onclick="window.location.reload()">🔄 Coba Hubungkan Lagi</button>
    </div>
</body>
</html>
